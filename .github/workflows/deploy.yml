name: Build and Deploy

on:
  push:
    branches: [main]

# Minimal permissions at workflow level; deploy job adds what it needs
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose vite-plus CLI
        run: echo "$PWD/node_modules/.bin" >> $GITHUB_PATH

      - name: Check (format, lint, types)
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        run: vp build
        env:
          VITE_BASE_URL: /trombone-pro/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
