<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Round Complete - Trombone Pro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Hanken Grotesk", sans-serif;
        background-color: #0f131d; /* surface-dim */
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .brass-gradient {
        background: linear-gradient(135deg, #f2ca50 0%, #d4af37 100%);
      }
      .card-glow {
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.1);
      }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#0f131d",
              "on-tertiary-fixed": "#1a1c1c",
              "primary-container": "#d4af37",
              "on-secondary-fixed": "#151c29",
              "inverse-primary": "#735c00",
              surface: "#0f131d",
              "surface-container-highest": "#313540",
              "on-secondary-container": "#b1b8cb",
              "surface-variant": "#313540",
              "surface-bright": "#353944",
              "tertiary-container": "#b2b3b3",
              "inverse-on-surface": "#2c303b",
              background: "#0f131d",
              "inverse-surface": "#dfe2f0",
              "on-primary-fixed": "#241a00",
              secondary: "#c0c6d9",
              primary: "#f2ca50",
              "on-error": "#690005",
              "surface-container-lowest": "#0a0e18",
              "on-primary-fixed-variant": "#574500",
              "on-surface": "#dfe2f0",
              "surface-container-high": "#262a34",
              "tertiary-fixed": "#e2e2e2",
              "surface-container": "#1b1f2a",
              outline: "#99907c",
              "on-primary": "#3c2f00",
              "error-container": "#93000a",
              "on-tertiary-fixed-variant": "#454747",
              "on-surface-variant": "#d0c5af",
              "primary-fixed-dim": "#e9c349",
              "secondary-fixed": "#dce2f6",
              "surface-tint": "#e9c349",
              "on-tertiary": "#2f3131",
              "on-secondary-fixed-variant": "#404756",
              "outline-variant": "#4d4635",
              "secondary-fixed-dim": "#c0c6d9",
              "on-primary-container": "#554300",
              "primary-fixed": "#ffe088",
              "on-tertiary-container": "#434546",
              "secondary-container": "#424958",
              "on-error-container": "#ffdad6",
              "on-background": "#dfe2f0",
              tertiary: "#cecece",
              "surface-container-low": "#171b26",
              "on-secondary": "#29303f",
              error: "#ffb4ab",
              "tertiary-fixed-dim": "#c6c6c7",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              gutter: "16px",
              "touch-target-min": "48px",
              base: "8px",
              "container-padding": "20px",
              "margin-mobile": "24px",
            },
            fontFamily: {
              "headline-lg": ["Hanken Grotesk"],
              "headline-md": ["Hanken Grotesk"],
              "label-md": ["Hanken Grotesk"],
              "body-md": ["Hanken Grotesk"],
              "body-lg": ["Hanken Grotesk"],
              "label-xl": ["Hanken Grotesk"],
            },
            fontSize: {
              "headline-lg": [
                "32px",
                { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "label-md": ["14px", { lineHeight: "20px", fontWeight: "500" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "label-xl": [
                "20px",
                { lineHeight: "24px", letterSpacing: "0.01em", fontWeight: "600" },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="flex flex-col min-h-screen bg-surface-dim text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden"
  >
    <!-- TopAppBar -->
    <header
      class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-touch-target-min bg-surface border-b border-outline-variant"
    >
      <button
        class="material-symbols-outlined text-primary hover:bg-surface-container-high transition-colors active:scale-95 duration-100 p-2 rounded-full"
      >
        menu
      </button>
      <h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">
        TROMBONE PRO
      </h1>
      <button
        class="material-symbols-outlined text-primary hover:bg-surface-container-high transition-colors active:scale-95 duration-100 p-2 rounded-full"
      >
        account_circle
      </button>
    </header>
    <!-- Main Content -->
    <main
      class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-16 pb-24 max-w-[390px] mx-auto w-full"
    >
      <!-- Success Animation / Illustration Placeholder -->
      <div class="mb-12 relative flex items-center justify-center">
        <div class="absolute w-48 h-48 bg-primary/10 rounded-full blur-3xl"></div>
        <div
          class="z-10 bg-surface-container border-2 border-primary-container rounded-full p-8 card-glow"
        >
          <span
            class="material-symbols-outlined text-[64px] text-primary"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >workspace_premium</span
          >
        </div>
      </div>
      <!-- Heading -->
      <h2 class="font-headline-lg text-headline-lg text-primary text-center mb-4 tracking-tight">
        Round Complete
      </h2>
      <!-- Score Card -->
      <div
        class="w-full bg-white rounded-xl p-8 mb-8 flex flex-col items-center justify-center border border-[#E2E8F0]"
      >
        <span
          class="font-label-md text-label-md text-on-secondary-container mb-2 uppercase tracking-widest"
          >Final Score</span
        >
        <div class="flex items-baseline gap-1">
          <span class="text-6xl font-extrabold text-surface-dim">16</span>
          <span class="text-2xl font-bold text-outline">/ 20</span>
        </div>
        <div class="mt-4 flex gap-1 w-full max-w-[200px]">
          <div class="h-2 flex-grow rounded-full bg-primary-container"></div>
          <div class="h-2 flex-grow rounded-full bg-primary-container"></div>
          <div class="h-2 flex-grow rounded-full bg-primary-container"></div>
          <div class="h-2 flex-grow rounded-full bg-surface-container-highest"></div>
        </div>
      </div>
      <!-- Feedback Text -->
      <p class="font-body-lg text-body-lg text-on-surface text-center px-4 leading-relaxed">
        Great job! Keep practicing to master those slide positions.
      </p>
      <!-- Action Area (Vertical Stack per Style Guide) -->
      <div class="w-full mt-12 flex flex-col gap-4">
        <button
          class="w-full h-touch-target-min bg-primary-container text-on-primary-container font-label-xl text-label-xl rounded-lg font-bold shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2"
          onclick="location.reload()"
        >
          <span class="material-symbols-outlined">replay</span>
          Play Again
        </button>
        <button
          class="w-full h-touch-target-min border-2 border-outline-variant text-on-surface-variant font-label-xl text-label-xl rounded-lg font-semibold hover:bg-surface-container transition-colors active:scale-95"
        >
          Review Mistakes
        </button>
      </div>
    </main>
    <!-- BottomNavBar -->
    <nav
      class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-low border-t border-outline-variant flex justify-around items-center h-20 pb-safe px-base"
    >
      <a
        class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90"
        href="#"
      >
        <span class="material-symbols-outlined">music_note</span>
        <span class="font-label-md text-label-md">Practice</span>
      </a>
      <a
        class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90"
        href="#"
      >
        <span class="material-symbols-outlined">library_music</span>
        <span class="font-label-md text-label-md">Library</span>
      </a>
      <!-- Active Tab: Stats (since it's a summary screen) -->
      <a
        class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-transform"
        href="#"
      >
        <span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1"
          >leaderboard</span
        >
        <span class="font-label-md text-label-md">Stats</span>
      </a>
    </nav>
    <!-- Micro-interaction for the score text -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const scoreElement = document.querySelector(".text-6xl");
        const target = 16;
        let current = 0;
        const duration = 1000;
        const increment = target / (duration / 16);

        const animate = () => {
          current += increment;
          if (current < target) {
            scoreElement.textContent = Math.floor(current);
            requestAnimationFrame(animate);
          } else {
            scoreElement.textContent = target;
          }
        };

        setTimeout(animate, 300);
      });
    </script>
  </body>
</html>
